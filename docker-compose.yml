services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  # API en su imagen de producción. Solo se levanta con:
  #   docker compose --profile app up -d --build
  api:
    profiles: ['app']
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de Docker la base de datos se llama "postgres" y escucha en 5432.
      DB_HOST: postgres
      DB_PORT: 5432
      PORT: 3000
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
